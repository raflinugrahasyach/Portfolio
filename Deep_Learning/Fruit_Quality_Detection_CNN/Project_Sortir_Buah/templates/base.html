<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IoT Fruit Sorting System{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: #f4f6f9;
            color: #2c3e50;
            line-height: 1.6;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: linear-gradient(135deg, #6a1b9a 0%, #8e24aa 50%, #9c27b0 100%);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 12px rgba(106, 27, 154, 0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.3px;
        }

        .navbar-brand::before {
            content: '🍎';
            font-size: 28px;
        }

        .navbar-nav {
            display: flex;
            gap: 8px;
            list-style: none;
            align-items: center;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-link.active {
            background: rgba(255, 255, 255, 0.25);
            font-weight: 600;
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-text {
            color: white;
            font-size: 14px;
            font-weight: 500;
        }

        .logout-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 24px;
        }

        /* ===== CARDS ===== */
        .card {
            background: white;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 28px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 2px solid #f0f2f5;
        }

        .card-header h3 {
            font-size: 17px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 0.2px;
        }

        .card-header::before {
            content: '📊';
            font-size: 22px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            padding: 11px 28px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: #5c6bc0;
            color: white;
        }

        .btn-primary:hover {
            background: #4a5bb3;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(92, 107, 192, 0.4);
        }

        .btn-danger {
            background: #ef5350;
            color: white;
        }

        .btn-danger:hover {
            background: #e53935;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 83, 80, 0.4);
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(46, 204, 113, 0.4);
        }

        .btn-secondary {
            background: #607d8b;
            color: white;
        }

        .btn-secondary:hover {
            background: #546e7a;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(96, 125, 139, 0.4);
        }

        /* ===== TABLES ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 16px 20px;
            text-align: center;
            font-weight: 700;
            color: #495057;
            border-bottom: 2px solid #e9ecef;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        th:first-child {
            text-align: center;
        }

        th:nth-child(2) {
            text-align: left;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
            text-align: center;
        }

        td:first-child {
            font-weight: 600;
            color: #6c757d;
            text-align: center;
        }

        td:nth-child(2) {
            text-align: left;
            font-weight: 500;
        }

        tr:hover {
            background: #f8f9fa;
        }

        /* ===== UTILITIES ===== */
        .text-center {
            text-align: center;
        }

        .mb-2 {
            margin-bottom: 16px;
        }

        .mb-3 {
            margin-bottom: 24px;
        }

        .mt-2 {
            margin-top: 16px;
        }

        .mt-3 {
            margin-top: 24px;
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="/dashboard" class="navbar-brand">IoT Fruit Sorting System</a>
        
        <ul class="navbar-nav">
            <li>
                <a href="/dashboard" class="nav-link {% if request.path in ['/', '/dashboard'] %}active{% endif %}">
                    Dashboard
                </a>
            </li>
            <li>
                <a href="/monitoring" class="nav-link {% if request.path == '/monitoring' %}active{% endif %}">
                    Monitoring
                </a>
            </li>
            <li>
                <a href="/pengenalan" class="nav-link {% if request.path in ['/pengenalan', '/penyortiran'] %}active{% endif %}">
                    📸 Pengenalan & Penyortiran
                </a>
            </li>
        </ul>
        
        <div class="navbar-right">
            <span class="user-text">Halo, Administrator</span>
            <button class="logout-btn">Logout</button>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
