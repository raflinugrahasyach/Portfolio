# render.yaml
# Blueprint configuration for Render.com Free Tier deployment
services:
  - type: web
    name: heartcare-ai-service
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: APP_ENV
        value: production
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: heartcare-docs
      - key: PINECONE_ENVIRONMENT
        value: us-east-1-aws
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.65"
      - key: INDOSBERT_MODEL
        value: "firqaaa/indo-sentence-bert-base"
